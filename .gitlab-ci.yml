stages:
  - test
  - build
  - e2e
  - migrate
  - deploy
  - verify
  - rollback

variables:
  DOCKER_TLS_CERTDIR: ''
  IMAGE_TAG: $CI_COMMIT_SHA
  IMAGE_NAME: $CI_REGISTRY_IMAGE:$IMAGE_TAG
  FRONTEND_IMAGE_NAME: $CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG
  STAGING_COMPOSE_FILE: deploy/staging/docker-compose.yml

project-check:
  stage: test
  image: python:3.13-slim
  before_script:
    - pip install --no-cache-dir uv
    - uv sync --all-groups
  script:
    - make project-check

frontend-check:
  stage: test
  image: node:22-alpine
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run build
    - npm run lint
    - npm run test

build-image:
  stage: build
  image: docker:28-cli
  services:
    - docker:28-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build -t "$IMAGE_NAME" .
    - docker push "$IMAGE_NAME"
    - docker build -t "$FRONTEND_IMAGE_NAME" frontend
    - docker push "$FRONTEND_IMAGE_NAME"

demo-e2e:
  stage: e2e
  image: docker:28-cli
  services:
    - docker:28-dind
  needs:
    - build-image
  variables:
    COMPOSE_PROJECT_NAME: docere-e2e
    DOCERE_IMAGE: $IMAGE_NAME
    DOCERE_FRONTEND_IMAGE: $FRONTEND_IMAGE_NAME
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker pull "$IMAGE_NAME"
    - docker pull "$FRONTEND_IMAGE_NAME"
  script:
    - docker compose up -d --no-build
    - docker compose wait createbuckets
    - docker compose run --rm api migrate
    - docker volume create docere-e2e-fixtures
    - >
      docker compose run --rm -v docere-e2e-fixtures:/fixtures api
      seed-demo --archive-output /fixtures/docere-demo-archive.zip
    - docker build -f frontend/Dockerfile.e2e -t docere-e2e-tests frontend
    - >
      docker run --name docere-e2e-run --network docere-e2e_default
      -e PLAYWRIGHT_BASE_URL=http://gateway
      -v docere-e2e-fixtures:/fixtures:ro
      docere-e2e-tests
  after_script:
    - docker cp docere-e2e-run:/tests/playwright-report frontend/playwright-report || true
    - docker cp docere-e2e-run:/tests/test-results frontend/test-results || true
    - docker rm -f docere-e2e-run || true
    - docker compose logs --no-color > e2e-compose.log || true
    - docker compose down -v || true
    - docker volume rm docere-e2e-fixtures || true
  artifacts:
    when: always
    paths:
      - e2e-compose.log
      - frontend/playwright-report/
      - frontend/test-results/
    expire_in: 7 days

migrate-staging:
  stage: migrate
  image: docker:28-cli
  services:
    - docker:28-dind
  needs:
    - build-image
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - printf '%s' "$STAGING_ENV_FILE" > .staging.env
  script:
    - docker pull "$IMAGE_NAME"
    - docker run --rm --env-file .staging.env "$IMAGE_NAME" migrate
  environment:
    name: staging

deploy-staging:
  stage: deploy
  image: alpine:3.22
  needs:
    - migrate-staging
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - printf '%s' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$STAGING_HOST" >> ~/.ssh/known_hosts
  script:
    - >
      ssh "$STAGING_SSH_USER@$STAGING_HOST"
      "cd $STAGING_APP_DIR &&
      export DOCERE_IMAGE=$IMAGE_NAME &&
      export DOCERE_FRONTEND_IMAGE=$FRONTEND_IMAGE_NAME &&
      docker compose -f $STAGING_COMPOSE_FILE pull &&
      docker compose -f $STAGING_COMPOSE_FILE up -d"
  environment:
    name: staging

smoke-staging:
  stage: verify
  image:
    name: $IMAGE_NAME
    entrypoint: ['']
  needs:
    - deploy-staging
  script:
    - python scripts/staging_smoke.py
  environment:
    name: staging

rollback-staging:
  stage: rollback
  image: alpine:3.22
  when: manual
  allow_failure: false
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - printf '%s' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$STAGING_HOST" >> ~/.ssh/known_hosts
  script:
    - >
      ssh "$STAGING_SSH_USER@$STAGING_HOST"
      "cd $STAGING_APP_DIR &&
      export DOCERE_IMAGE=$CI_REGISTRY_IMAGE:$ROLLBACK_IMAGE_TAG &&
      export DOCERE_FRONTEND_IMAGE=$CI_REGISTRY_IMAGE/frontend:$ROLLBACK_IMAGE_TAG &&
      docker compose -f $STAGING_COMPOSE_FILE pull &&
      docker compose -f $STAGING_COMPOSE_FILE up -d"
  environment:
    name: staging
