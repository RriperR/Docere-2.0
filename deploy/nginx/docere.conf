worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;

    log_format upstreamlog '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           'rt=$request_time urt=$upstream_response_time '
                           'upstream_addr=$upstream_addr upstream_status=$upstream_status';

    access_log /var/log/nginx/access.log upstreamlog;
    error_log /var/log/nginx/error.log warn;
    server_tokens off;

    # Дефолт nginx — 1 МБ; поднимаем под загрузку вложений (снимки, PDF, DICOM).
    client_max_body_size 200m;

    upstream docere_api {
        zone docere_api 64k;
        least_conn;
        server api:8000 resolve max_fails=1 fail_timeout=3s;
        keepalive 32;
    }

    upstream docere_frontend {
        zone docere_frontend 64k;
        server frontend:80 resolve max_fails=1 fail_timeout=3s;
        keepalive 16;
    }

    server {
        listen 80;

        location = /nginx-health {
            default_type text/plain;
            return 200 'ok';
        }

        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 1s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_pass http://docere_api;
        }

        location ~ ^/(docs|redoc|openapi.json) {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://docere_api;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_pass http://docere_frontend;
        }
    }
}
