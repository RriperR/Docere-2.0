services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docere
      POSTGRES_USER: docere
      POSTGRES_PASSWORD: docere
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U docere -d docere']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio_data:/data

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/docere-records;
      "

  api:
    image: ${DOCERE_IMAGE:-docere-api:local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_SERVICE_NAME: docere-service
      APP_DATABASE__URL: postgresql+psycopg://docere:docere@postgres:5432/docere
      APP_AUTH__SECRET_KEY: dev-secret-key
      APP_STORAGE__ENDPOINT: http://minio:9000
      APP_STORAGE__BUCKET: docere-records
      APP_STORAGE__ACCESS_KEY: minioadmin
      APP_STORAGE__SECRET_KEY: minioadmin
      APP_QUEUE__BROKER_URL: redis://redis:6379/0
      APP_QUEUE__RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    stop_signal: SIGTERM
    stop_grace_period: 15s
    expose:
      - '8000'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_started
      frontend:
        condition: service_healthy
    ports:
      - '8000:80'
    volumes:
      - ./deploy/nginx/docere.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/nginx-health']
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    image: ${DOCERE_FRONTEND_IMAGE:-docere-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - '80'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/health']
      interval: 10s
      timeout: 3s
      retries: 12

  celery-worker:
    image: ${DOCERE_IMAGE:-docere-api:local}
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ['/bin/sh', '-c']
    command:
      - >
        python -m app.infrastructure.adapters.queue.recover_import_jobs &&
        celery --app app.infrastructure.adapters.queue.celery_app:celery_app worker --loglevel=INFO
    environment:
      APP_SERVICE_NAME: docere-service
      APP_DATABASE__URL: postgresql+psycopg://docere:docere@postgres:5432/docere
      APP_AUTH__SECRET_KEY: dev-secret-key
      APP_STORAGE__ENDPOINT: http://minio:9000
      APP_STORAGE__BUCKET: docere-records
      APP_STORAGE__ACCESS_KEY: minioadmin
      APP_STORAGE__SECRET_KEY: minioadmin
      APP_QUEUE__BROKER_URL: redis://redis:6379/0
      APP_QUEUE__RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
